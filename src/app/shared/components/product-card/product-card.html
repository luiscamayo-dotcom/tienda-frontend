<article class="product-card">
  <div class="image-wrapper">
    <img [src]="product().imageUrl" [alt]="product().name" />
    <span class="category-badge">{{ product().categoryName }}</span>
  </div>

  <div class="card-body">
    <h3>{{ product().name }}</h3>
    <p class="description">{{ product().description }}</p>

    <div class="meta-row">
      <span class="price">$ {{ product().price | number:'1.0-0' }}</span>
      <span class="stock" [class.out]="product().stock === 0">
        {{ product().stock > 0 ? 'Stock: ' + product().stock : 'Agotado' }}
      </span>
    </div>

    <div class="actions">
      <a [routerLink]="['/producto', product().id]" class="btn-detail">Ver detalle</a>

      <button
        type="button"
        class="btn-cart"
        [disabled]="product().stock === 0"
        (click)="addToCart.emit(product().id)"
      >
        {{ product().stock === 0 ? 'Sin stock' : '+ Carrito' }}
      </button>
    </div>
  </div>
</article>

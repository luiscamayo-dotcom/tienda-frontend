<article class="cart-row">
  <!-- Información del producto y límite disponible para la compra. -->
  <div class="item-info">
    <h4>{{ item().product.name }}</h4>
    <p class="unit-price">Precio unitario: $ {{ item().product.price }}</p>
    <small>Stock máximo: {{ item().product.stock }}</small>
  </div>

  <!-- Controles que comunican a la página los cambios de cantidad. -->
  <div class="item-controls">
    <button
      type="button"
      (click)="quantityChange.emit({ productId: item().product.id, quantity: item().quantity - 1 })"
    >
      -
    </button>
    <span>{{ item().quantity }}</span>
    <button
      type="button"
      [disabled]="item().quantity >= item().product.stock"
      (click)="quantityChange.emit({ productId: item().product.id, quantity: item().quantity + 1 })"
    >
      +
    </button>
  </div>

  <!-- Subtotal de la línea y acción para retirarla del carrito. -->
  <div class="item-subtotal">
    <strong>$ {{ item().product.price * item().quantity }}</strong>
    <button type="button" class="btn-remove" (click)="remove.emit(item().product.id)">
      Eliminar
    </button>
  </div>
</article>

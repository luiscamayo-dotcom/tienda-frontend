<section class="admin-section">
  <!-- Encabezado y acceso a la acción principal de la sección. -->
  <div class="admin-header">
    <h2>Administración de Productos</h2>
    <button type="button" class="btn-primary">+ Nuevo producto</button>
  </div>

  <!-- Tabla con el resumen de productos y sus acciones disponibles. -->
  <div class="table-wrapper">
    <table class="admin-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Producto</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (product of products; track product.id) {
          <tr>
            <td>#{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.category }}</td>
            <td>$ {{ product.price }}</td>
            <td>{{ product.stock }}</td>
            <td class="actions-cell">
              <button type="button">Editar</button>
              <button type="button">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
